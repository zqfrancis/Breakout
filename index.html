<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 · 游戏开发第 1 课</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1020;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas {
    aspect-ratio: 2 / 3;
    height: min(96vh, 150vw);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(80, 120, 255, .25);
    touch-action: none; user-select: none; -webkit-user-select: none;
    display: block;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================================
   游戏开发第 1 课：打砖块 v0.3
   v0.1 练：概念 1 游戏主循环 Game Loop ／ 概念 2 碰撞检测 Collision
   v0.2 练：概念 3 掉落物系统 ／ 概念 4 粒子系统 ／ 概念 5 游戏手感 juice
   v0.3 新增：
     - 中/EN 双语切换：所有界面文字收进 T 字典，右上角按钮一键切换，偏好存 localStorage
     - 双枪道具：挡板两头长炮管，自动向上开火——新概念 6：子弹系统
       （生成 → 移动 → 碰撞 → 回收，跟粒子系统一样，是放哪款游戏都通用的技术）
   v0.3.1 掉率 22%→10% + 同屏掉落物上限 3 个（防刷屏）；
   v0.3.2 语言按钮改画进 canvas（DOM 按钮曾盖住血条），血条/最佳挪到 HUD 第二行。
   操作：鼠标移动 / 手指拖动 / ← → 键移动挡板，点击或空格发球
   ========================================================================== */

const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 双语字典：界面所有文字都在这里，一处改、处处生效 ---------- */
const T = {
  zh: {
    title: '打砖块', lesson: '游戏开发第 1 课',
    level: n => `第 ${n} 关`,
    tapLaunch: '点击 / 空格 发球',
    controls: '鼠标移动 · 手指拖动 · ← → 键',
    score: '分数', best: '最佳',
    combo: (n, m) => `连击 ${n}  ×${m}`,
    gameOver: '游戏结束',
    finalScore: (s, b) => `得分 ${s}　最佳 ${b}`,
    playAgain: '点击 / 空格 再来一局',
    powWide: '加长', powPierce: '火球', powGuns: '双枪',
    fxWide: '▬', fxPierce: '🔥', fxGuns: '双枪',
  },
  en: {
    title: 'Breakout', lesson: 'Game Dev Lesson 1',
    level: n => `Level ${n}`,
    tapLaunch: 'Tap / Space to launch',
    controls: 'Mouse · touch drag · ← → keys',
    score: 'Score', best: 'Best',
    combo: (n, m) => `Combo ${n} ×${m}`,
    gameOver: 'Game Over',
    finalScore: (s, b) => `Score ${s}  Best ${b}`,
    playAgain: 'Tap / Space to play again',
    powWide: 'WIDE', powPierce: 'FIRE', powGuns: 'GUNS',
    fxWide: '▬', fxPierce: '🔥', fxGuns: 'GUNS',
  },
};
let lang = localStorage.getItem('breakout-lang') || 'zh';
const t = () => T[lang];
/* 语言按钮直接画在 canvas 里（右上角），和 HUD 同一坐标系，
   彻底避免 DOM 按钮盖住 canvas 文字——v0.3 的 DOM 按钮就犯了这个错 */
const LANG_BTN = { x: W - 96, y: 10, w: 84, h: 36 };
function applyLang() {
  document.title = `${t().title} · ${t().lesson}`;
  localStorage.setItem('breakout-lang', lang);
}
function toggleLang() {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLang();
  beep(660, .06);
}
applyLang();

/* ---------- 音效：WebAudio 现场合成 ---------- */
let actx = null;
function beep(freq, dur = 0.07, type = 'square', vol = 0.12) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function powerSound() { beep(523, .08); setTimeout(() => beep(659, .08), 80); setTimeout(() => beep(784, .12), 160); }

/* ---------- 游戏状态 ---------- */
let state = 'ready';
let score = 0, lives = 3, level = 1;
let combo = 0;
let best = +(localStorage.getItem('breakout-best') || 0);
const comboMult = () => Math.min(5, 1 + Math.floor(combo / 10));

/* ---------- 挡板 ---------- */
const paddle = { w: 96, h: 14, x: W / 2 - 48, y: H - 70, speed: 560, wideT: 0, gunsT: 0 };
const paddleW = () => paddle.wideT > 0 ? paddle.w * 1.5 : paddle.w;

/* ---------- 小球（数组，支持多球） ---------- */
const BASE_SPEED = 440;
let balls = [];
function makeBall(x, y, vx, vy) {
  return { r: 8, x, y, vx, vy, pierceT: 0, trail: [] };
}
function stickBallToPaddle() {
  balls = [makeBall(0, 0, 0, 0)];
  placeBallOnPaddle(balls[0]);
}
function placeBallOnPaddle(b) {
  b.x = paddle.x + paddleW() / 2;
  b.y = paddle.y - b.r - 1;
  b.vx = 0; b.vy = 0;
}
function launchBall() {
  const speed = BASE_SPEED * (1 + (level - 1) * 0.12);
  const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
  const b = balls[0];
  b.vx = speed * Math.cos(a);
  b.vy = speed * Math.sin(a);
  state = 'playing';
  beep(440, 0.08);
}

/* ---------- 砖块 ---------- */
const ROWS = 6, COLS = 9, GAP = 6, BRICK_H = 26, TOP = 96;
const BRICK_W = (W - GAP * (COLS + 1)) / COLS;
const ROW_COLORS = ['#ff5d5d', '#ff9f43', '#ffd32a', '#2ed573', '#1e90ff', '#a55eea'];
let bricks = [];
function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({
        x: GAP + c * (BRICK_W + GAP), y: TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H, color: ROW_COLORS[r % ROW_COLORS.length], alive: true,
      });
}

/* ---------- 概念 3：掉落物系统 ---------- */
const POWERS = {
  multi:  { color: '#22d3ee', dur: 0 },
  wide:   { color: '#2ed573', dur: 12 },
  pierce: { color: '#ff9f43', dur: 10 },
  guns:   { color: '#a55eea', dur: 10 },
};
const POWER_LABEL = p =>
  p === 'multi' ? '×3' : { wide: t().powWide, pierce: t().powPierce, guns: t().powGuns }[p];
let powerups = [];
function maybeDropPower(x, y) {
  if (powerups.length >= 3) return;   // 同屏最多 3 个掉落物，防止刷屏
  if (Math.random() > 0.10) return;   // 10% 掉率
  const r = Math.random();
  const type = r < 0.30 ? 'multi' : r < 0.60 ? 'wide' : r < 0.85 ? 'pierce' : 'guns';
  powerups.push({ x, y, vy: 150, type, w: 52, h: 28 });
}
function applyPower(type) {
  powerSound();
  burst(paddle.x + paddleW() / 2, paddle.y, POWERS[type].color, 14);
  if (type === 'multi') {
    const src = balls.slice();
    for (const b of src) {
      if (balls.length >= 12) break;
      const speed = Math.hypot(b.vx, b.vy) || BASE_SPEED;
      const base = Math.atan2(b.vy, b.vx);
      for (const da of [0.45, -0.45]) {
        if (balls.length >= 12) break;
        const a = base + da;
        balls.push(makeBall(b.x, b.y, speed * Math.cos(a), speed * Math.sin(a)));
      }
    }
  } else if (type === 'wide') {
    paddle.wideT = POWERS.wide.dur;
  } else if (type === 'pierce') {
    for (const b of balls) b.pierceT = POWERS.pierce.dur;
  } else if (type === 'guns') {
    paddle.gunsT = POWERS.guns.dur;
    fireT = GUN_INTERVAL;   // 捡到立刻开第一枪，反馈爽快
  }
}

/* ---------- 概念 6：子弹系统（双枪道具） ----------
   跟粒子系统一个思路：数组存所有子弹，每帧移动 → 碰砖 → 消砖/消失 → 飞出屏幕回收 */
let bullets = [];   // {x, y, vy}
const GUN_INTERVAL = 0.25;
let fireT = 0;

/* ---------- 概念 4：粒子系统 ---------- */
let particles = [];
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      color: Math.random() < 0.3 ? '#ffffff' : color,
      size: 2 + Math.random() * 3.5,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98; p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---------- 屏幕震动 ---------- */
let shakeT = 0;
const SHAKE_DUR = 0.35;
function shake() { shakeT = SHAKE_DUR; }

/* ---------- 输入 ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleTap(); }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', e => {
  paddle.x = clamp(canvasX(e.clientX) - paddleW() / 2, 0, W - paddleW());
});
function canvasY(clientY) {
  const r = canvas.getBoundingClientRect();
  return (clientY - r.top) * (H / r.height);
}
canvas.addEventListener('pointerdown', e => {
  const cx = canvasX(e.clientX), cy = canvasY(e.clientY);
  // 先判语言按钮：点中只切换语言，不动挡板、不发球
  if (cx >= LANG_BTN.x && cx <= LANG_BTN.x + LANG_BTN.w &&
      cy >= LANG_BTN.y && cy <= LANG_BTN.y + LANG_BTN.h) {
    toggleLang();
    return;
  }
  paddle.x = clamp(cx - paddleW() / 2, 0, W - paddleW());
  handleTap();
});
function handleTap() {
  if (state === 'ready') launchBall();
  else if (state === 'gameover') restartAll();
}
function restartAll() {
  score = 0; lives = 3; level = 1; combo = 0;
  paddle.x = W / 2 - paddle.w / 2; paddle.wideT = 0; paddle.gunsT = 0;
  powerups = []; particles = []; bullets = [];
  buildBricks(); stickBallToPaddle();
  state = 'ready';
}

/* ---------- 概念 1：游戏主循环 ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  if (keys['ArrowLeft'])  paddle.x -= paddle.speed * dt;
  if (keys['ArrowRight']) paddle.x += paddle.speed * dt;
  if (paddle.wideT > 0) paddle.wideT -= dt;
  if (paddle.gunsT > 0) paddle.gunsT -= dt;
  paddle.x = clamp(paddle.x, 0, W - paddleW());

  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    const pw = paddleW();
    if (p.y + p.h / 2 >= paddle.y && p.y - p.h / 2 <= paddle.y + paddle.h &&
        p.x > paddle.x - p.w / 2 && p.x < paddle.x + pw + p.w / 2) {
      applyPower(p.type);
      powerups.splice(i, 1);
    } else if (p.y - p.h / 2 > H) {
      powerups.splice(i, 1);
    }
  }

  updateParticles(dt);
  if (shakeT > 0) shakeT -= dt;

  if (state === 'ready') { if (balls[0]) placeBallOnPaddle(balls[0]); return; }
  if (state !== 'playing') return;

  for (const b of balls) if (b.pierceT > 0) b.pierceT -= dt;

  // 双枪开火：两头各一发
  if (paddle.gunsT > 0) {
    fireT += dt;
    const pw = paddleW();
    while (fireT >= GUN_INTERVAL) {
      fireT -= GUN_INTERVAL;
      bullets.push({ x: paddle.x + 8, y: paddle.y - 8, vy: -720 });
      bullets.push({ x: paddle.x + pw - 8, y: paddle.y - 8, vy: -720 });
      beep(880, .04, 'square', .05);
    }
  }

  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const ball = balls[bi];
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.trail.unshift({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.pop();

    if (ball.x < ball.r)         { ball.x = ball.r;     ball.vx =  Math.abs(ball.vx); beep(200, .05); }
    if (ball.x > W - ball.r)     { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(200, .05); }
    if (ball.y < ball.r)         { ball.y = ball.r;     ball.vy =  Math.abs(ball.vy); beep(200, .05); }
    if (ball.y - ball.r > H)     { balls.splice(bi, 1); continue; }

    const pw = paddleW();
    if (circleHitsRect(ball, { x: paddle.x, y: paddle.y, w: pw, h: paddle.h })) {
      const hit = (ball.x - (paddle.x + pw / 2)) / (pw / 2);
      const speed = Math.hypot(ball.vx, ball.vy);
      const angle = -Math.PI / 2 + hit * (Math.PI / 3);
      ball.vx = speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
      ball.y = paddle.y - ball.r - 0.5;
      beep(330, .06);
    }

    for (const b of bricks) {
      if (!b.alive) continue;
      if (circleHitsRect(ball, b)) {
        smashBrick(b);
        if (ball.pierceT <= 0) {
          const overlapX = (ball.r + b.w / 2) - Math.abs(ball.x - (b.x + b.w / 2));
          const overlapY = (ball.r + b.h / 2) - Math.abs(ball.y - (b.y + b.h / 2));
          if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
        }
        break;
      }
    }
  }

  // 子弹：移动 → 撞砖 → 消砖/消失 → 飞出回收
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.y += bl.vy * dt;
    if (bl.y < -12) { bullets.splice(i, 1); continue; }
    for (const b of bricks) {
      if (!b.alive) continue;
      if (bl.x > b.x - 2 && bl.x < b.x + b.w + 2 && bl.y > b.y - 10 && bl.y < b.y + b.h) {
        smashBrick(b);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  if (balls.length === 0) { loseLife(); return; }
  if (bricks.every(b => !b.alive)) nextLevel();
}

/* 消砖的公共逻辑：小球和子弹都调它（计分/连击/粒子/掉落/音效收一处） */
function smashBrick(b) {
  b.alive = false;
  combo++;
  score += 10 * level * comboMult();
  burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 10);
  maybeDropPower(b.x + b.w / 2, b.y + b.h / 2);
  beep(520 + Math.random() * 200, .05);
}

function circleHitsRect(c, r) {
  const nx = clamp(c.x, r.x, r.x + r.w);
  const ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny;
  return dx * dx + dy * dy <= c.r * c.r;
}

function loseLife() {
  lives--;
  combo = 0;
  shake();
  burst(W / 2, H - 120, '#ff5d5d', 24);
  bullets = [];
  beep(160, .25, 'sawtooth', .15);
  if (lives <= 0) {
    state = 'gameover';
    if (score > best) { best = score; localStorage.setItem('breakout-best', best); }
  } else {
    state = 'ready';
    stickBallToPaddle();
  }
}
function nextLevel() {
  level++; combo = 0;
  powerups = []; bullets = [];
  buildBricks();
  stickBallToPaddle();
  state = 'ready';
  beep(660, .1); setTimeout(() => beep(880, .12), 110);
}

/* ---------- 绘制 ---------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.save();
  if (shakeT > 0) {
    const k = shakeT / SHAKE_DUR * 10;
    ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k);
  }

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e1530'); g.addColorStop(1, '#0b1020');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    roundRect(b.x, b.y, b.w, 8, 5); ctx.fill();
  }

  for (const p of powerups) {
    ctx.fillStyle = POWERS[p.type].color;
    roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 13); ctx.fill();
    ctx.fillStyle = '#0b1020'; ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(POWER_LABEL(p.type), p.x, p.y + 1);
    ctx.textBaseline = 'alphabetic';
  }

  // 子弹
  ctx.shadowColor = '#ffd32a'; ctx.shadowBlur = 10;
  ctx.fillStyle = '#ffd32a';
  for (const bl of bullets) {
    roundRect(bl.x - 2.5, bl.y - 8, 5, 12, 2.5); ctx.fill();
  }
  ctx.shadowBlur = 0;

  const pw = paddleW();
  // 双枪炮管
  if (paddle.gunsT > 0) {
    ctx.fillStyle = '#a55eea';
    roundRect(paddle.x + 4, paddle.y - 12, 8, 16, 3); ctx.fill();
    roundRect(paddle.x + pw - 12, paddle.y - 12, 8, 16, 3); ctx.fill();
  }
  ctx.shadowColor = paddle.wideT > 0 ? '#2ed573' : '#4da3ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = paddle.wideT > 0 ? '#2ed573' : '#4da3ff';
  roundRect(paddle.x, paddle.y, pw, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;

  for (const ball of balls) {
    const hot = ball.pierceT > 0;
    for (let i = ball.trail.length - 1; i >= 1; i--) {
      const tr = ball.trail[i], a = (1 - i / ball.trail.length) * 0.3;
      ctx.fillStyle = hot ? `rgba(255,159,67,${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(tr.x, tr.y, ball.r * (1 - i / (ball.trail.length + 4)), 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowColor = hot ? '#ff9f43' : '#fff'; ctx.shadowBlur = 16;
    ctx.fillStyle = hot ? '#ff9f43' : '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const p of particles) {
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD（全部走双语字典）
  ctx.fillStyle = '#8b98b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(t().score + ' ' + score, 16, 36);
  if (combo >= 2) {
    ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText(t().combo(combo, comboMult()), 16, 64);
  }
  ctx.fillStyle = '#8b98b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(t().level(level), W / 2, 36);
  ctx.textAlign = 'right';
  ctx.fillText('❤'.repeat(Math.max(lives, 0)) + '  ' + t().best + ' ' + best, W - 16, 64);
  const fx = [];
  if (paddle.wideT > 0) fx.push(t().fxWide + ' ' + Math.ceil(paddle.wideT) + 's');
  const pt = balls.reduce((m, b) => Math.max(m, b.pierceT), 0);
  if (pt > 0) fx.push(t().fxPierce + ' ' + Math.ceil(pt) + 's');
  if (paddle.gunsT > 0) fx.push(t().fxGuns + ' ' + Math.ceil(paddle.gunsT) + 's');
  if (fx.length) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#8b98b8'; ctx.font = '17px sans-serif';
    ctx.fillText(fx.join('    '), W / 2, H - 16);
  }

  // 语言切换按钮（画进 canvas，和 HUD 同一坐标系，不会互相遮挡）
  ctx.fillStyle = 'rgba(10,15,35,.7)';
  roundRect(LANG_BTN.x, LANG_BTN.y, LANG_BTN.w, LANG_BTN.h, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5;
  roundRect(LANG_BTN.x, LANG_BTN.y, LANG_BTN.w, LANG_BTN.h, 20); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lang === 'zh' ? 'EN' : '中文',
    LANG_BTN.x + LANG_BTN.w / 2, LANG_BTN.y + LANG_BTN.h / 2 + 1);
  ctx.textBaseline = 'alphabetic';

  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(5,8,20,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    if (state === 'ready') {
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText(level === 1 && score === 0 ? t().title : t().level(level), W / 2, H / 2 - 30);
      ctx.font = '22px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText(t().tapLaunch, W / 2, H / 2 + 20);
      ctx.font = '18px sans-serif';
      ctx.fillText(t().controls, W / 2, H / 2 + 52);
    } else if (state === 'gameover') {
      ctx.font = 'bold 44px sans-serif'; ctx.fillText(t().gameOver, W / 2, H / 2 - 40);
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#ffd32a';
      ctx.fillText(t().finalScore(score, best), W / 2, H / 2 + 8);
      ctx.font = '20px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText(t().playAgain, W / 2, H / 2 + 48);
    }
  }
}

/* ---------- 启动 ---------- */
buildBricks();
stickBallToPaddle();
requestAnimationFrame(loop);
</script>
</body>
</html>
