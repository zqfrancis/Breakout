<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 · 游戏开发第 1 课</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1020;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas {
    aspect-ratio: 2 / 3;
    height: min(96vh, 150vw);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(80, 120, 255, .25);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================================
   游戏开发第 1 课：打砖块
   这一课只练两个核心概念，几乎所有 2D 游戏都靠它们：
     概念 1 —— 游戏主循环 Game Loop：requestAnimationFrame 驱动的 update + draw
     概念 2 —— 碰撞检测 Collision：小球 vs 墙 / 挡板 / 砖块，用的都是 AABB 相交
   操作：鼠标移动 / 手指拖动 / ← → 键移动挡板，点击或空格发球
   ========================================================================== */

const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 小音效：WebAudio 现场合成，不用任何音频文件 ---------- */
let actx = null;
function beep(freq, dur = 0.07, type = 'square', vol = 0.12) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* 没有音频环境就静默 */ }
}

/* ---------- 游戏状态 ---------- */
let state = 'ready';            // ready=待发球 playing=进行中 win=过关 gameover=结束
let score = 0, lives = 3, level = 1;
let best = +(localStorage.getItem('breakout-best') || 0);

/* ---------- 挡板 ---------- */
const paddle = { w: 96, h: 14, x: W / 2 - 48, y: H - 70, speed: 560 };

/* ---------- 小球 ---------- */
const ball = { r: 8, x: 0, y: 0, vx: 0, vy: 0 };
const BASE_SPEED = 440;
function stickBallToPaddle() {
  ball.x = paddle.x + paddle.w / 2;
  ball.y = paddle.y - ball.r - 1;
}
function launchBall() {
  const speed = BASE_SPEED * (1 + (level - 1) * 0.12);   // 关卡越高球越快
  const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);  // 朝上，带一点随机
  ball.vx = speed * Math.cos(a);
  ball.vy = speed * Math.sin(a);
  state = 'playing';
  beep(440, 0.08);
}

/* ---------- 砖块 ---------- */
const ROWS = 6, COLS = 9, GAP = 6, BRICK_H = 26, TOP = 96;
const BRICK_W = (W - GAP * (COLS + 1)) / COLS;
const ROW_COLORS = ['#ff5d5d', '#ff9f43', '#ffd32a', '#2ed573', '#1e90ff', '#a55eea'];
let bricks = [];
function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      bricks.push({
        x: GAP + c * (BRICK_W + GAP),
        y: TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H,
        color: ROW_COLORS[r % ROW_COLORS.length],
        alive: true,
      });
    }
  }
}

/* ---------- 输入：鼠标 / 触屏 / 键盘 ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleTap(); }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', e => {
  paddle.x = clamp(canvasX(e.clientX) - paddle.w / 2, 0, W - paddle.w);
});
canvas.addEventListener('pointerdown', e => {
  paddle.x = clamp(canvasX(e.clientX) - paddle.w / 2, 0, W - paddle.w);
  handleTap();
});
function handleTap() {
  if (state === 'ready') launchBall();
  else if (state === 'win' || state === 'gameover') restartAll();
}
function restartAll() {
  score = 0; lives = 3; level = 1;
  paddle.x = W / 2 - paddle.w / 2;
  buildBricks(); stickBallToPaddle();
  state = 'ready';
}

/* ============================================================================
   概念 1：游戏主循环 Game Loop
   浏览器每帧调用一次 loop(now) → 先 update(dt) 算逻辑，再 draw() 画出来。
   dt 是上一帧到这一帧的秒数，所有移动都乘以 dt，这样在 60Hz 和 120Hz
   屏幕上球速看起来一样快。dt 上限 0.033s：切后台回来不会穿墙。
   ========================================================================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- 每帧的逻辑更新 ---------- */
function update(dt) {
  if (keys['ArrowLeft'])  paddle.x -= paddle.speed * dt;
  if (keys['ArrowRight']) paddle.x += paddle.speed * dt;
  paddle.x = clamp(paddle.x, 0, W - paddle.w);

  if (state === 'ready') { stickBallToPaddle(); return; }
  if (state !== 'playing') return;

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // 墙壁：碰到就把速度分量取反
  if (ball.x < ball.r)            { ball.x = ball.r;     ball.vx =  Math.abs(ball.vx); beep(200, .05); }
  if (ball.x > W - ball.r)        { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(200, .05); }
  if (ball.y < ball.r)            { ball.y = ball.r;     ball.vy =  Math.abs(ball.vy); beep(200, .05); }
  if (ball.y - ball.r > H)        { loseLife(); return; }   // 掉出底边

  /* ---- 概念 2a：小球 vs 挡板 ----
     先用"圆 vs 矩形"相交判断撞没撞上；撞上了，根据击中挡板的位置
     给一个反弹角度（打边上飞得斜，打中间弹得直）——这就是"手感" */
  if (circleHitsRect(ball, paddle)) {
    const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
    const speed = Math.hypot(ball.vx, ball.vy);
    const angle = -Math.PI / 2 + hit * (Math.PI / 3);                   // 最大偏 60°
    ball.vx = speed * Math.cos(angle);
    ball.vy = speed * Math.sin(angle);
    ball.y = paddle.y - ball.r - 0.5;   // 推出去，避免下一帧还算相交
    beep(330, .06);
  }

  /* ---- 概念 2b：小球 vs 砖块 ----
     逐块做相交判断；撞上了砖块消失，按"最小穿透轴"决定横弹还是竖弹 */
  for (const b of bricks) {
    if (!b.alive) continue;
    if (circleHitsRect(ball, b)) {
      b.alive = false;
      score += 10 * level;
      const overlapX = (ball.r + b.w / 2) - Math.abs(ball.x - (b.x + b.w / 2));
      const overlapY = (ball.r + b.h / 2) - Math.abs(ball.y - (b.y + b.h / 2));
      if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
      beep(520 + Math.random() * 200, .05);
      break;   // 一帧只消一块，防止高速球一次穿多块
    }
  }

  if (bricks.every(b => !b.alive)) nextLevel();
}

/* ---------- 圆 vs 矩形相交：找矩形上离圆心最近的点，看距离是否 ≤ 半径 ---------- */
function circleHitsRect(c, r) {
  const nx = clamp(c.x, r.x, r.x + r.w);
  const ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny;
  return dx * dx + dy * dy <= c.r * c.r;
}

function loseLife() {
  lives--;
  beep(160, .25, 'sawtooth', .15);
  if (lives <= 0) {
    state = 'gameover';
    if (score > best) { best = score; localStorage.setItem('breakout-best', best); }
  } else {
    state = 'ready';
    stickBallToPaddle();
  }
}
function nextLevel() {
  level++;
  buildBricks();
  stickBallToPaddle();
  state = 'ready';
  beep(660, .1); setTimeout(() => beep(880, .12), 110);
}

/* ---------- 每帧的绘制 ---------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e1530'); g.addColorStop(1, '#0b1020');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 砖块
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    roundRect(b.x, b.y, b.w, 8, 5); ctx.fill();
  }

  // 挡板（发光）
  ctx.shadowColor = '#4da3ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = '#4da3ff';
  roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;

  // 小球（发光）
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  // HUD
  ctx.fillStyle = '#8b98b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('分数 ' + score, 16, 36);
  ctx.textAlign = 'center';
  ctx.fillText('第 ' + level + ' 关', W / 2, 36);
  ctx.textAlign = 'right';
  ctx.fillText('❤'.repeat(Math.max(lives, 0)) + '  最佳 ' + best, W - 16, 36);

  // 状态遮罩
  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(5,8,20,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    if (state === 'ready') {
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText(level === 1 && score === 0 ? '打砖块' : '第 ' + level + ' 关', W / 2, H / 2 - 30);
      ctx.font = '22px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText('点击 / 空格 发球', W / 2, H / 2 + 20);
      ctx.font = '18px sans-serif';
      ctx.fillText('鼠标移动 · 手指拖动 · ← → 键', W / 2, H / 2 + 52);
    } else if (state === 'win') {
      ctx.font = 'bold 40px sans-serif'; ctx.fillText('过关！', W / 2, H / 2 - 10);
    } else if (state === 'gameover') {
      ctx.font = 'bold 44px sans-serif'; ctx.fillText('游戏结束', W / 2, H / 2 - 40);
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#ffd32a';
      ctx.fillText('得分 ' + score + '　最佳 ' + best, W / 2, H / 2 + 8);
      ctx.font = '20px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText('点击 / 空格 再来一局', W / 2, H / 2 + 48);
    }
  }
}

/* ---------- 启动 ---------- */
buildBricks();
stickBallToPaddle();
requestAnimationFrame(loop);
</script>
</body>
</html>
