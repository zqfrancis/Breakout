<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打砖块 · 游戏开发第 1 课</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1020;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  canvas {
    aspect-ratio: 2 / 3;
    height: min(96vh, 150vw);
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(80, 120, 255, .25);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* ============================================================================
   游戏开发第 1 课：打砖块 v0.2
   v0.1 练：概念 1 游戏主循环 Game Loop ／ 概念 2 碰撞检测 Collision
   v0.2 新增：
     概念 3 —— 掉落物系统：砖块按概率掉道具（多球/加长/火球），接住生效、限时消失
     概念 4 —— 粒子系统：砖块碎裂的粒子爆炸，一个数组管所有粒子，通用于任何游戏
     概念 5 —— 游戏手感 juice：拖尾、屏幕震动、连击倍率——"好玩"大多是这些细节堆出来的
   操作：鼠标移动 / 手指拖动 / ← → 键移动挡板，点击或空格发球
   ========================================================================== */

const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 音效：WebAudio 现场合成 ---------- */
let actx = null;
function beep(freq, dur = 0.07, type = 'square', vol = 0.12) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function powerSound() { beep(523, .08); setTimeout(() => beep(659, .08), 80); setTimeout(() => beep(784, .12), 160); }

/* ---------- 游戏状态 ---------- */
let state = 'ready';            // ready | playing | gameover（过关直接进下一关，不另设状态）
let score = 0, lives = 3, level = 1;
let combo = 0;                  // 连击：连续消砖数，丢球清零
let best = +(localStorage.getItem('breakout-best') || 0);
const comboMult = () => Math.min(5, 1 + Math.floor(combo / 10));  // 每10连击+1倍，上限×5

/* ---------- 挡板 ---------- */
const paddle = { w: 96, h: 14, x: W / 2 - 48, y: H - 70, speed: 560, wideT: 0 };
const paddleW = () => paddle.wideT > 0 ? paddle.w * 1.5 : paddle.w;  // 加长道具生效中？

/* ---------- 小球（v0.2 起支持多球，所以用数组） ---------- */
const BASE_SPEED = 440;
let balls = [];
function makeBall(x, y, vx, vy) {
  return { r: 8, x, y, vx, vy, pierceT: 0, trail: [] };
}
function stickBallToPaddle() {
  balls = [makeBall(0, 0, 0, 0)];
  placeBallOnPaddle(balls[0]);
}
function placeBallOnPaddle(b) {
  b.x = paddle.x + paddleW() / 2;
  b.y = paddle.y - b.r - 1;
  b.vx = 0; b.vy = 0;
}
function launchBall() {
  const speed = BASE_SPEED * (1 + (level - 1) * 0.12);
  const a = -Math.PI / 2 + (Math.random() * 0.6 - 0.3);
  const b = balls[0];
  b.vx = speed * Math.cos(a);
  b.vy = speed * Math.sin(a);
  state = 'playing';
  beep(440, 0.08);
}

/* ---------- 砖块 ---------- */
const ROWS = 6, COLS = 9, GAP = 6, BRICK_H = 26, TOP = 96;
const BRICK_W = (W - GAP * (COLS + 1)) / COLS;
const ROW_COLORS = ['#ff5d5d', '#ff9f43', '#ffd32a', '#2ed573', '#1e90ff', '#a55eea'];
let bricks = [];
function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({
        x: GAP + c * (BRICK_W + GAP), y: TOP + r * (BRICK_H + GAP),
        w: BRICK_W, h: BRICK_H, color: ROW_COLORS[r % ROW_COLORS.length], alive: true,
      });
}

/* ============================================================================
   概念 3：掉落物系统
   数据：POWERS 描述每种道具（颜色/文字/持续时间/生效函数）
   流程：砖块碎了 → 按概率生成掉落物 → 掉落物下落 → 挡板接住→生效 / 掉出屏幕→消失
   ========================================================================== */
const POWERS = {
  multi:  { color: '#22d3ee', label: '×3',   dur: 0,  desc: '多球' },
  wide:   { color: '#2ed573', label: '加长', dur: 12, desc: '加长挡板' },
  pierce: { color: '#ff9f43', label: '火球', dur: 10, desc: '穿透火球' },
};
let powerups = [];   // {x, y, vy, type}
function maybeDropPower(x, y) {
  if (Math.random() > 0.22) return;                       // 22% 掉率
  const r = Math.random();
  const type = r < 0.35 ? 'multi' : r < 0.7 ? 'wide' : 'pierce';
  powerups.push({ x, y, vy: 150, type, w: 52, h: 28 });
}
function applyPower(type) {
  powerSound();
  burst(paddle.x + paddleW() / 2, paddle.y, POWERS[type].color, 14);
  if (type === 'multi') {
    // 每个现有球分裂出 2 个，速度方向转 ±25°，总数上限 12
    const src = balls.slice();
    for (const b of src) {
      if (balls.length >= 12) break;
      const speed = Math.hypot(b.vx, b.vy) || BASE_SPEED;
      const base = Math.atan2(b.vy, b.vx);
      for (const da of [0.45, -0.45]) {
        if (balls.length >= 12) break;
        const a = base + da;
        balls.push(makeBall(b.x, b.y, speed * Math.cos(a), speed * Math.sin(a)));
      }
    }
  } else if (type === 'wide') {
    paddle.wideT = POWERS.wide.dur;
  } else if (type === 'pierce') {
    for (const b of balls) b.pierceT = POWERS.pierce.dur;  // 火球：穿砖不反弹
  }
}

/* ============================================================================
   概念 4：粒子系统
   一个数组管所有粒子：每帧按速度移动、减速、减命；画的时候按剩余寿命算透明度。
   这套代码搬到任何游戏里都能用，是游戏开发最通用的"胶水"技术之一。
   ========================================================================== */
let particles = [];  // {x, y, vx, vy, life, maxLife, color, size}
function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.4, maxLife: 0.9,
      color: Math.random() < 0.3 ? '#ffffff' : color,
      size: 2 + Math.random() * 3.5,
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98; p.vy += 300 * dt;   // 轻微重力
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---------- 屏幕震动（juice） ---------- */
let shakeT = 0;
const SHAKE_DUR = 0.35;
function shake() { shakeT = SHAKE_DUR; }

/* ---------- 输入 ---------- */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); handleTap(); }
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
canvas.addEventListener('pointermove', e => {
  paddle.x = clamp(canvasX(e.clientX) - paddleW() / 2, 0, W - paddleW());
});
canvas.addEventListener('pointerdown', e => {
  paddle.x = clamp(canvasX(e.clientX) - paddleW() / 2, 0, W - paddleW());
  handleTap();
});
function handleTap() {
  if (state === 'ready') launchBall();
  else if (state === 'gameover') restartAll();
}
function restartAll() {
  score = 0; lives = 3; level = 1; combo = 0;
  paddle.x = W / 2 - paddle.w / 2; paddle.wideT = 0;
  powerups = []; particles = [];
  buildBricks(); stickBallToPaddle();
  state = 'ready';
}

/* ============================================================================
   概念 1：游戏主循环 Game Loop（v0.1 已讲，v0.2 逻辑变多了但骨架不变）
   ========================================================================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // 挡板移动 + 加长计时
  if (keys['ArrowLeft'])  paddle.x -= paddle.speed * dt;
  if (keys['ArrowRight']) paddle.x += paddle.speed * dt;
  if (paddle.wideT > 0) paddle.wideT -= dt;
  paddle.x = clamp(paddle.x, 0, W - paddleW());

  // 掉落物：下落 → 接住生效 / 掉出消失
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    const pw = paddleW();
    if (p.y + p.h / 2 >= paddle.y && p.y - p.h / 2 <= paddle.y + paddle.h &&
        p.x > paddle.x - p.w / 2 && p.x < paddle.x + pw + p.w / 2) {
      applyPower(p.type);
      powerups.splice(i, 1);
    } else if (p.y - p.h / 2 > H) {
      powerups.splice(i, 1);
    }
  }

  updateParticles(dt);
  if (shakeT > 0) shakeT -= dt;

  if (state === 'ready') { if (balls[0]) placeBallOnPaddle(balls[0]); return; }
  if (state !== 'playing') return;

  // 火球计时
  for (const b of balls) if (b.pierceT > 0) b.pierceT -= dt;

  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const ball = balls[bi];
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 拖尾：记录最近 14 个位置
    ball.trail.unshift({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.pop();

    // 墙壁
    if (ball.x < ball.r)         { ball.x = ball.r;     ball.vx =  Math.abs(ball.vx); beep(200, .05); }
    if (ball.x > W - ball.r)     { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(200, .05); }
    if (ball.y < ball.r)         { ball.y = ball.r;     ball.vy =  Math.abs(ball.vy); beep(200, .05); }
    if (ball.y - ball.r > H)     { balls.splice(bi, 1); continue; }  // 这个球丢了

    // 小球 vs 挡板：按击中位置给角度（v0.1 概念 2a）
    const pw = paddleW();
    if (circleHitsRect(ball, { x: paddle.x, y: paddle.y, w: pw, h: paddle.h })) {
      const hit = (ball.x - (paddle.x + pw / 2)) / (pw / 2);
      const speed = Math.hypot(ball.vx, ball.vy);
      const angle = -Math.PI / 2 + hit * (Math.PI / 3);
      ball.vx = speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
      ball.y = paddle.y - ball.r - 0.5;
      beep(330, .06);
    }

    // 小球 vs 砖块（v0.1 概念 2b；火球状态下穿砖不反弹）
    for (const b of bricks) {
      if (!b.alive) continue;
      if (circleHitsRect(ball, b)) {
        b.alive = false;
        combo++;
        score += 10 * level * comboMult();
        burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 10);
        maybeDropPower(b.x + b.w / 2, b.y + b.h / 2);
        if (ball.pierceT <= 0) {
          const overlapX = (ball.r + b.w / 2) - Math.abs(ball.x - (b.x + b.w / 2));
          const overlapY = (ball.r + b.h / 2) - Math.abs(ball.y - (b.y + b.h / 2));
          if (overlapX < overlapY) ball.vx *= -1; else ball.vy *= -1;
        }
        beep(520 + Math.random() * 200, .05);
        break;
      }
    }
  }

  if (balls.length === 0) { loseLife(); return; }   // 球全丢光才算丢命
  if (bricks.every(b => !b.alive)) nextLevel();
}

function circleHitsRect(c, r) {
  const nx = clamp(c.x, r.x, r.x + r.w);
  const ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny;
  return dx * dx + dy * dy <= c.r * c.r;
}

function loseLife() {
  lives--;
  combo = 0;                 // 丢球连击清零
  shake();                   // juice：震屏
  burst(W / 2, H - 120, '#ff5d5d', 24);
  beep(160, .25, 'sawtooth', .15);
  if (lives <= 0) {
    state = 'gameover';
    if (score > best) { best = score; localStorage.setItem('breakout-best', best); }
  } else {
    state = 'ready';
    stickBallToPaddle();
  }
}
function nextLevel() {
  level++; combo = 0;
  powerups = [];
  buildBricks();
  stickBallToPaddle();
  state = 'ready';
  beep(660, .1); setTimeout(() => beep(880, .12), 110);
}

/* ---------- 绘制 ---------- */
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function draw() {
  ctx.save();
  if (shakeT > 0) {  // juice：屏幕震动
    const k = shakeT / SHAKE_DUR * 10;
    ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k);
  }

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e1530'); g.addColorStop(1, '#0b1020');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const b of bricks) {   // 砖块
    if (!b.alive) continue;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    roundRect(b.x, b.y, b.w, 8, 5); ctx.fill();
  }

  for (const p of powerups) {  // 掉落物
    const def = POWERS[p.type];
    ctx.fillStyle = def.color;
    roundRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h, 13); ctx.fill();
    ctx.fillStyle = '#0b1020'; ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.label, p.x, p.y + 1);
    ctx.textBaseline = 'alphabetic';
  }

  const pw = paddleW();        // 挡板
  ctx.shadowColor = paddle.wideT > 0 ? '#2ed573' : '#4da3ff'; ctx.shadowBlur = 18;
  ctx.fillStyle = paddle.wideT > 0 ? '#2ed573' : '#4da3ff';
  roundRect(paddle.x, paddle.y, pw, paddle.h, 7); ctx.fill();
  ctx.shadowBlur = 0;

  for (const ball of balls) {  // 小球 + 拖尾（juice）
    const hot = ball.pierceT > 0;
    for (let i = ball.trail.length - 1; i >= 1; i--) {
      const t = ball.trail[i], a = (1 - i / ball.trail.length) * 0.3;
      ctx.fillStyle = hot ? `rgba(255,159,67,${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (1 - i / (ball.trail.length + 4)), 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowColor = hot ? '#ff9f43' : '#fff'; ctx.shadowBlur = 16;
    ctx.fillStyle = hot ? '#ff9f43' : '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  for (const p of particles) {  // 粒子
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = '#8b98b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('分数 ' + score, 16, 36);
  if (combo >= 2) {
    ctx.fillStyle = '#ffd32a'; ctx.font = 'bold 20px sans-serif';
    ctx.fillText('连击 ' + combo + '  ×' + comboMult(), 16, 64);
  }
  ctx.fillStyle = '#8b98b8'; ctx.font = '20px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('第 ' + level + ' 关', W / 2, 36);
  ctx.textAlign = 'right';
  ctx.fillText('❤'.repeat(Math.max(lives, 0)) + '  最佳 ' + best, W - 16, 36);
  // 生效中的道具计时
  const fx = [];
  if (paddle.wideT > 0) fx.push('▬ ' + Math.ceil(paddle.wideT) + 's');
  const pt = balls.reduce((m, b) => Math.max(m, b.pierceT), 0);
  if (pt > 0) fx.push('🔥 ' + Math.ceil(pt) + 's');
  if (fx.length) {
    ctx.textAlign = 'center'; ctx.fillStyle = '#8b98b8'; ctx.font = '17px sans-serif';
    ctx.fillText(fx.join('    '), W / 2, H - 16);
  }

  if (state !== 'playing') {
    ctx.fillStyle = 'rgba(5,8,20,.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    if (state === 'ready') {
      ctx.font = 'bold 40px sans-serif';
      ctx.fillText(level === 1 && score === 0 ? '打砖块' : '第 ' + level + ' 关', W / 2, H / 2 - 30);
      ctx.font = '22px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText('点击 / 空格 发球', W / 2, H / 2 + 20);
      ctx.font = '18px sans-serif';
      ctx.fillText('鼠标移动 · 手指拖动 · ← → 键', W / 2, H / 2 + 52);
    } else if (state === 'gameover') {
      ctx.font = 'bold 44px sans-serif'; ctx.fillText('游戏结束', W / 2, H / 2 - 40);
      ctx.font = '24px sans-serif'; ctx.fillStyle = '#ffd32a';
      ctx.fillText('得分 ' + score + '　最佳 ' + best, W / 2, H / 2 + 8);
      ctx.font = '20px sans-serif'; ctx.fillStyle = '#8b98b8';
      ctx.fillText('点击 / 空格 再来一局', W / 2, H / 2 + 48);
    }
  }
}

/* ---------- 启动 ---------- */
buildBricks();
stickBallToPaddle();
requestAnimationFrame(loop);
</script>
</body>
</html>
